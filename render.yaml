services:
  - type: web
    name: humanornot
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: HF_API_KEY
        sync: false
      - key: PORT
        value: "10000"
