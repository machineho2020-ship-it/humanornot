<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumanOrNot — AI Content Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1.1rem;
            color: #888;
            max-width: 500px;
            margin: 0 auto;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }
        .textarea-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            background: #1a1a2e;
            border: 2px solid #333;
            border-radius: 12px;
            color: #f5f5f5;
            font-size: 1rem;
            padding: 16px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #feca57;
        }
        textarea::placeholder { color: #555; }
        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: #555;
            margin-top: 6px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .result {
            margin-top: 30px;
            display: none;
        }
        .result.show { display: block; }
        .verdict {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .verdict.human {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }
        .verdict.ai {
            background: linear-gradient(135deg, #e17055, #fdcb6e);
            color: #fff;
        }
        .verdict.error {
            background: #333;
            color: #ff6b6b;
            font-size: 1rem;
        }
        .score-bar {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .bar-bg {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }
        .bar-fill-h {
            height: 100%;
            background: linear-gradient(90deg, #00b894, #00cec9);
            border-radius: 5px;
            transition: width 0.8s ease;
        }
        .bar-fill-ai {
            height: 100%;
            background: linear-gradient(90deg, #e17055, #fdcb6e);
            border-radius: 5px;
            transition: width 0.8s ease;
        }
        .confidence {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .limits {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #555;
        }
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loader.show { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #feca57;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 0.8rem;
        }
        footer a { color: #feca57; text-decoration: none; }
    </style>
</head>
<body>

<div class="hero">
    <h1>HumanOrNot</h1>
    <p>Paste any text. Find out if a human or AI wrote it.</p>
</div>

<div class="container">
    <div class="textarea-wrap">
        <textarea id="textInput" placeholder="Paste text here (minimum 50 characters)..."></textarea>
        <div class="char-count"><span id="charCount">0</span> characters</div>
    </div>

    <button class="btn" id="detectBtn" onclick="detectText()">Detect Now</button>

    <div class="limits">Free: 10 checks/day · <a href="#" style="color:#feca57;">Upgrade for unlimited</a></div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Analyzing text...</p>
    </div>

    <div class="result" id="result">
        <div class="verdict" id="verdict"></div>
        <div class="score-bar">
            <div class="score-row">
                <span>✅ Human</span>
                <span id="humanPct">0%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill-h" id="barH" style="width:0%"></div></div>
        </div>
        <div class="score-bar">
            <div class="score-row">
                <span>🤖 AI-Generated</span>
                <span id="aiPct">0%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill-ai" id="barAI" style="width:0%"></div></div>
        </div>
        <div class="confidence" id="confidence"></div>
    </div>
</div>

<footer>
    Powered by <a href="https://huggingface.co">Hugging Face</a> · <a href="#">Terms</a> · Built by <a href="#">HumanOrNot</a>
</footer>

<script>
    const textarea = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');

    textarea.addEventListener('input', () => {
        charCount.textContent = textarea.value.length;
    });

    async function detectText() {
        const text = textarea.value.trim();
        const btn = document.getElementById('detectBtn');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');

        if (text.length < 50) {
            alert('Please enter at least 50 characters.');
            return;
        }

        btn.disabled = true;
        loader.classList.add('show');
        result.classList.remove('show');

        try {
            const resp = await fetch('/detect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const data = await resp.json();

            if (data.error) {
                showError(data.error);
                return;
            }

            document.getElementById('humanPct').textContent = data.human_pct + '%';
            document.getElementById('aiPct').textContent = data.ai_pct + '%';
            document.getElementById('barH').style.width = data.human_pct + '%';
            document.getElementById('barAI').style.width = data.ai_pct + '%';
            document.getElementById('confidence').textContent = `Confidence: ${data.confidence}%`;

            const verdictEl = document.getElementById('verdict');
            verdictEl.textContent = data.verdict;
            verdictEl.className = 'verdict ' + (data.ai_pct > data.human_pct ? 'ai' : 'human');

            result.classList.add('show');

        } catch (e) {
            showError('Something went wrong. Please try again.');
        } finally {
            btn.disabled = false;
            loader.classList.remove('show');
        }
    }

    function showError(msg) {
        const result = document.getElementById('result');
        const verdictEl = document.getElementById('verdict');
        verdictEl.textContent = '⚠️ ' + msg;
        verdictEl.className = 'verdict error';
        result.classList.add('show');
    }
</script>

</body>
</html>
